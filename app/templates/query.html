{% extends "base.html" %}
{% block page_name %}OData-Abfrage{% endblock %}{% block main_class %}query-workspace{% endblock %}
{% block content %}
<details class="query-controls" open><summary>Abfrageoptionen</summary><form method="post" class="query-layout" id="query-form"><label class="query-service">OData-Dienst<select name="service_id" id="service-id"><option value="">Manuelle URL verwenden</option>{% for x in services %}<option value="{{x.id}}" {{'selected' if selected==x.id else ''}}>{{x.service_name}} — {{x.object_name or ''}}</option>{% endfor %}</select></label><label class="query-service">OData V4-URL<input type="url" name="manual_url" id="manual-url" value="{{inputs.get('manual_url','')}}"></label><div class="query-run"><button type="button" class="secondary" id="check-url">URL prüfen</button><button type="button" class="secondary" id="save-url">Als Adresse speichern</button><button class="button">Abfrage ausführen</button><span id="schema-status" class="muted"></span></div><div class="query-options"><div class="query-option"><label>Expand-Tabellen</label><div id="expand-checkboxes" class="checkbox-list"></div></div><div class="query-option"><label>Feldfilter<select name="filter_field" id="filter-field"><option value="">Kein Filter</option></select></label><label>Bedingung<select name="filter_operator"><option value="eq">ist gleich</option><option value="ne">ist ungleich</option><option value="contains">enthält</option><option value="startswith">beginnt mit</option></select></label><input name="filter_input" value="{{inputs.get('filter_input','')}}" placeholder="Filterwert"></div><div class="query-option"><label class="switch"><input type="checkbox" name="use_top" {{'checked' if inputs.get('use_top')=='on' else ''}}> Top begrenzen</label><input name="top_value" type="number" min="1" value="{{inputs.get('top_value','100')}}"><label class="switch"><input type="checkbox" name="use_orderby" {{'checked' if inputs.get('use_orderby')=='on' else ''}}> Sortieren</label><select name="orderby_field" id="orderby-field"><option value="">Feld wählen</option></select><select name="orderby_direction"><option value="asc">aufsteigend</option><option value="desc">absteigend</option></select></div></div><div class="query-fields"><label>Gewünschte Felder<select name="select_fields" id="select-fields" multiple size="10"></select></label></div></form></details>
{% if message %}<p class="notice">{{message}}</p>{% endif %}
{% if result %}<section class="master-detail" id="master-detail" tabindex="0"><div class="result-toolbar"><span id="selected-record">Datensatz auswählen</span><button type="button" class="secondary" id="export-button">Excel exportieren</button></div><div class="modern-grid" id="main-grid"></div><div id="detail-grids" class="detail-grids"></div></section><form method="post" action="/odata/export" id="export-form"><input type="hidden" name="payload" id="export-payload"></form><script id="result-data" type="application/json">{{result.raw_rows|tojson}}</script><script id="result-expands" type="application/json">{{result.expands|tojson}}</script>{% endif %}
<dialog id="save-dialog" class="address-dialog"><form method="post" action="/admin/odata" class="formgrid"><div class="dialog-heading"><h2>Neue OData-Adresse</h2><button type="button" class="secondary" data-close>×</button></div><label>Gruppe<input name="group_name"></label><label>Objektart<input name="object_type"></label><label>Objekt-ID<input name="object_id" type="number"></label><label>Objektname<input name="object_name"></label><label>Servicename<input name="service_name" id="save-service-name" required></label><label class="wide">OData V4-URL<input name="odata_v4_url" id="save-v4-url" required></label><div class="dialog-actions wide"><button type="button" class="secondary" data-close>Abbrechen</button><button class="button">Speichern</button></div></form></dialog>
<script>
const saved={{inputs|tojson}},service=document.querySelector('#service-id'),manual=document.querySelector('#manual-url'),status=document.querySelector('#schema-status'),filter=document.querySelector('#filter-field'),fields=document.querySelector('#select-fields'),orderby=document.querySelector('#orderby-field'),expandBox=document.querySelector('#expand-checkboxes');
function opt(el,v,label,selected=false){let o=document.createElement('option');o.value=v;o.textContent=label;o.selected=selected;el.append(o)}function schemaUrl(){return manual.value.trim()?'/odata/schema?url='+encodeURIComponent(manual.value.trim()):'/odata/schema?service_id='+service.value}
async function load(){if(!manual.value.trim()&&!service.value)return;status.textContent='Prüfung läuft …';[filter,fields,orderby].forEach(x=>x.innerHTML='');expandBox.innerHTML='';opt(filter,'','Kein Filter');opt(orderby,'','Feld wählen');try{let d=await(await fetch(schemaUrl())).json();if(!d.ok)throw Error(d.message);d.fields.forEach(x=>{opt(filter,x.name,x.name,saved.filter_field===x.name);opt(fields,x.name,`${x.name} (${x.type})`,(saved.select_fields||[]).includes(x.name));opt(orderby,x.name,x.name,saved.orderby_field===x.name)});d.expands.forEach(x=>{let label=document.createElement('label');label.className='switch';let check=document.createElement('input');check.type='checkbox';check.name='expand_tables';check.value=x;check.checked=(saved.expand_tables||[]).includes(x);label.append(check,document.createTextNode(' '+x));expandBox.append(label)});status.textContent=`Geprüft: ${d.fields.length} Felder, ${d.expands.length} Untertabellen.`}catch(e){status.textContent=e.message}}
service.onchange=()=>{if(service.value)manual.value='';load()};manual.onchange=()=>{if(manual.value)service.value='';load()};document.querySelector('#check-url').onclick=load;document.querySelector('[name=filter_operator]').value=saved.filter_operator||'eq';document.querySelector('[name=orderby_direction]').value=saved.orderby_direction||'asc';document.querySelector('#save-url').onclick=()=>{if(!manual.value.trim())return alert('Bitte eine OData V4-URL eingeben.');document.querySelector('#save-v4-url').value=manual.value.trim();document.querySelector('#save-service-name').value=manual.value.trim().split('/').pop();document.querySelector('#save-dialog').showModal()};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('dialog').close());if(service.value||manual.value)load();
function text(v){return v===null||v===undefined?'':typeof v==='object'?JSON.stringify(v):String(v)}function columns(rows,skip=[]){return [...new Set(rows.flatMap(x=>Object.keys(x)).filter(x=>!skip.includes(x)))]}function makeGrid(title,rows,host,onSelect){let cols=columns(rows);let wrap=document.createElement('section');wrap.className='grid-card';wrap.innerHTML=`<h2>${title}</h2><div class="grid-scroll"><table><thead><tr>${cols.map(c=>`<th>${c}<span class="column-resizer"></span></th>`).join('')}</tr></thead><tbody>${rows.map((row,i)=>`<tr data-index="${i}">${cols.map(c=>`<td>${text(row[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;host.append(wrap);wrap.querySelectorAll('tbody tr').forEach(row=>row.onclick=()=>onSelect(Number(row.dataset.index)));resizeColumns(wrap.querySelector('table'));return wrap}
function resizeColumns(table){table.querySelectorAll('th').forEach(th=>th.querySelector('.column-resizer').onmousedown=e=>{e.preventDefault();let x=e.clientX,w=th.getBoundingClientRect().width,move=q=>{let n=Math.max(90,w+q.clientX-x);th.style.width=n+'px';th.style.minWidth=n+'px'},up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)})}
const raw=document.querySelector('#result-data')?JSON.parse(document.querySelector('#result-data').textContent):[];
const relations=document.querySelector('#result-expands')?JSON.parse(document.querySelector('#result-expands').textContent):[];
let active=0;
function renderDetails(){
 const main=document.querySelector('#main-grid'), detail=document.querySelector('#detail-grids'); main.innerHTML=''; detail.innerHTML=''; if(!raw.length)return;
 const mainRows=raw.map(row=>Object.fromEntries(Object.entries(row).filter(([key])=>!relations.includes(key))));
 const card=makeGrid('Haupttabelle',mainRows,main,index=>{active=index;renderDetails()});
 card.querySelectorAll('tbody tr')[active]?.classList.add('selected-row'); document.querySelector('#selected-record').textContent=`Datensatz ${active+1} von ${raw.length}`;
 relations.forEach(relation=>{const value=raw[active][relation];if(value&&typeof value==='object'){makeGrid(relation,Array.isArray(value)?value:[value],detail,()=>{})}});
}
renderDetails();
document.querySelector('#master-detail').onkeydown=event=>{if(event.key==='ArrowDown'){active=Math.min(raw.length-1,active+1);renderDetails();event.preventDefault()}if(event.key==='ArrowUp'){active=Math.max(0,active-1);renderDetails();event.preventDefault()}};
document.querySelector('#export-button')?.addEventListener('click',()=>{const sheets={};sheets.Haupttabelle=raw.map(row=>{const clean={};Object.keys(row).filter(key=>!relations.includes(key)).forEach(key=>clean[key]=row[key]);return clean});relations.forEach(relation=>{const value=raw[active]?.[relation];if(value)sheets[relation]=Array.isArray(value)?value:[value]});document.querySelector('#export-payload').value=JSON.stringify({sheets});document.querySelector('#export-form').submit()});

</script>{% endblock %}
